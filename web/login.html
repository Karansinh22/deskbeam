<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeskBeam – Sign in</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1c1e21;--mut:#6b7280;--acc:#2563eb;--err:#dc2626;--bd:#d9dce1}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e25;--fg:#e8eaed;--mut:#9aa0aa;--acc:#5b8def;--err:#f87171;--bd:#2c303a}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
form{width:min(360px,100% - 32px);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:28px}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 20px;color:var(--mut);font-size:14px}
label{display:block;font-size:13px;margin:12px 0 4px}input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button{margin-top:20px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
#e{color:var(--err);font-size:14px;min-height:20px;margin-top:12px}
</style></head><body>
<form id="f"><h1>DeskBeam</h1><p>Sign in to view and control this device.</p>
<label for="u">Username</label><input id="u" autocomplete="username" required autofocus>
<label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
<button>Sign in</button><div id="e" role="alert"></div></form>
<script>
f.onsubmit=async ev=>{ev.preventDefault();e.textContent="";
const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u.value,password:p.value})});
if(r.ok)location.href="/";else e.textContent=(await r.json()).error||"Login failed";};
</script></body></html>
