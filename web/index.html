<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remote Desktop</title>
<style>
:root{--bg:#0b0c0f;--bar:#1b1e25;--fg:#e8eaed;--acc:#5b8def}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
#bar{position:fixed;top:0;left:0;right:0;height:38px;display:flex;gap:10px;align-items:center;padding:0 12px;background:var(--bar);z-index:2;transition:transform .2s}
#bar.hide{transform:translateY(-100%)}
#st{margin-right:auto}select,button{background:var(--bg);color:var(--fg);border:1px solid #333;border-radius:6px;padding:4px 8px;font:inherit;cursor:pointer}
#v,#cv{position:fixed;top:38px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 38px);object-fit:contain;background:#000;cursor:none;outline:none}
#cv{display:none}
body.fs #v,body.fs #cv{top:0;height:100%}
</style></head><body>
<div id="bar"><span id="st">Connecting…</span>
<select id="q" title="Quality (bitrate)"><option value="3000">Low 3 Mbps</option><option value="8000" selected>Good 8 Mbps</option><option value="15000">High 15 Mbps</option></select>
<select id="mode" title="Connection mode"><option value="auto">Auto</option><option value="webrtc">Direct only</option><option value="ws">Compatibility</option></select><button id="fs">Fullscreen</button><button id="lo">Log out</button></div>
<video id="v" autoplay muted playsinline tabindex="0"></video><canvas id="cv" tabindex="0"></canvas>
<script>
const $=id=>document.getElementById(id);let pc,ws,ch={},cfg,mode,dec,fallbackTimer,gotKey=false,ts=0;
const st=t=>$("st").textContent=t;
const v=$("v"),cv=$("cv"),ctx=cv.getContext("2d");
function send(c,o){
  if(mode==="ws"){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:"in",m:o}));return}
  const d=ch[c];if(d&&d.readyState==="open")d.send(JSON.stringify(o));}
const pref=()=>{try{return localStorage.getItem("nmrd-mode")||"auto"}catch(_){return"auto"}};
$("mode").value=pref();
$("mode").onchange=e=>{try{localStorage.setItem("nmrd-mode",e.target.value)}catch(_){}ws&&ws.close()};
function show(m){v.style.display=m==="webrtc"?"block":"none";cv.style.display=m==="ws"?"block":"none";}
function begin(m){
  mode=m;clearTimeout(fallbackTimer);gotKey=false;
  if(pc){pc.close();pc=null}if(dec){try{dec.close()}catch(_){}dec=null}ch={};show(m);
  if(m==="ws"&&!window.VideoDecoder){st("This browser lacks WebCodecs – use Chrome/Edge/Firefox");return}
  ws.send(JSON.stringify({type:"start",mode:m}));
  if(m==="webrtc"&&pref()==="auto")fallbackTimer=setTimeout(()=>{if(!pc||pc.connectionState!=="connected"){st("Direct link blocked – switching to compatibility mode…");begin("ws")}},7000);
}
function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");ws.binaryType="arraybuffer";
  ws.onopen=()=>begin(pref()==="ws"?"ws":"webrtc");
  ws.onclose=()=>{clearTimeout(fallbackTimer);st("Disconnected – reconnecting…");setTimeout(()=>{pc&&pc.close();connect()},2000)};
  ws.onmessage=async e=>{
    if(e.data instanceof ArrayBuffer){return frame(new Uint8Array(e.data))}
    const m=JSON.parse(e.data);
    if(m.type==="config"){cfg=m;
      if(m.mode==="ws"){setupDecoder();st("Connected (compatibility mode)");return}
      pc=new RTCPeerConnection({iceServers:m.ice_servers,bundlePolicy:"max-bundle"});
      pc.ontrack=ev=>{v.srcObject=ev.streams[0]||new MediaStream([ev.track]);
        try{ev.receiver.playoutDelayHint=0;ev.receiver.jitterBufferTarget=0}catch(_){}};
      pc.ondatachannel=ev=>{ch[ev.channel.label]=ev.channel};
      pc.onicecandidate=ev=>ev.candidate&&ws.send(JSON.stringify({type:"ice",mline:ev.candidate.sdpMLineIndex,candidate:ev.candidate.candidate}));
      pc.onconnectionstatechange=()=>{const s=pc.connectionState;st(s==="connected"?"Connected (direct)":"Link: "+s);
        if((s==="failed"||s==="disconnected")&&pref()==="auto")setTimeout(()=>{if(pc&&pc.connectionState!=="connected")begin("ws")},3000)};}
    else if(m.type==="offer"){await pc.setRemoteDescription({type:"offer",sdp:m.sdp});
      const a=await pc.createAnswer();await pc.setLocalDescription(a);ws.send(JSON.stringify({type:"answer",sdp:a.sdp}));}
    else if(m.type==="ice"&&pc){pc.addIceCandidate({candidate:m.candidate,sdpMLineIndex:m.mline}).catch(()=>{});}
  };
}
function setupDecoder(){
  dec=new VideoDecoder({output:f=>{if(cv.width!==f.displayWidth||cv.height!==f.displayHeight){cv.width=f.displayWidth;cv.height=f.displayHeight}
      ctx.drawImage(f,0,0);f.close()},error:e=>{console.warn(e);st("Decoder error – reconnecting");ws.close()}});
  dec.configure({codec:"avc1.42C028",optimizeForLatency:true});
}
function frame(b){
  if(!dec||dec.state!=="configured")return;
  const key=b[0]===1;if(!gotKey&&!key)return;gotKey=true;
  if(dec.decodeQueueSize>4&&!key)return;            // decoder behind: skip delta frames
  dec.decode(new EncodedVideoChunk({type:key?"key":"delta",timestamp:ts+=33333,data:b.subarray(1)}));
}
const el=()=>mode==="ws"?cv:v;
function pos(e){const t=el(),r=t.getBoundingClientRect(),vw=(mode==="ws"?cv.width:v.videoWidth)||cfg.w,vh=(mode==="ws"?cv.height:v.videoHeight)||cfg.h;
  const s=Math.min(r.width/vw,r.height/vh),w=vw*s,h=vh*s,ox=r.left+(r.width-w)/2,oy=r.top+(r.height-h)/2;
  return{x:Math.min(1,Math.max(0,(e.clientX-ox)/w)),y:Math.min(1,Math.max(0,(e.clientY-oy)/h))};}
let mvPending=null;                                  // coalesce mouse moves to one per frame
function queueMove(e){const first=!mvPending;mvPending=pos(e);if(first)requestAnimationFrame(()=>{send("mouse",{t:"mv",...mvPending});mvPending=null})}
for(const t of [v,cv]){
  t.addEventListener("pointermove",queueMove);
  t.addEventListener("pointerdown",e=>{t.focus();t.setPointerCapture(e.pointerId);send("mouse",{t:"mv",...pos(e)});send("key",{t:"md",b:e.button});e.preventDefault()});
  t.addEventListener("pointerup",e=>{send("key",{t:"mu",b:e.button});e.preventDefault()});
  t.addEventListener("contextmenu",e=>e.preventDefault());
  t.addEventListener("wheel",e=>{send("key",{t:"wh",n:Math.sign(e.deltaY)*Math.min(5,Math.ceil(Math.abs(e.deltaY)/60))});e.preventDefault()},{passive:false});
  t.addEventListener("keydown",e=>{send("key",{t:"kd",k:e.key,c:e.code});e.preventDefault()});
  t.addEventListener("keyup",e=>{send("key",{t:"ku",k:e.key,c:e.code});e.preventDefault()});
  t.addEventListener("blur",()=>send("key",{t:"ra"}));
}
$("q").onchange=e=>send("key",{t:"q",kbps:+e.target.value});
$("fs").onclick=()=>{document.body.classList.add("fs");$("bar").classList.add("hide");document.documentElement.requestFullscreen?.();el().focus()};
document.onfullscreenchange=()=>{if(!document.fullscreenElement){document.body.classList.remove("fs");$("bar").classList.remove("hide")}};
$("lo").onclick=async()=>{await fetch("/api/logout",{method:"POST"});location.href="/login"};
connect();
</script></body></html>
